name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run these exact gates against the tagged commit instead of
  # keeping a second, drifting copy of them.
  workflow_call:

permissions:
  contents: read

env:
  # Never let the toolchain silently download a different Go than the matrix
  # selected: the point of the matrix is to prove the go.mod floor really builds.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares the current Go release as its floor, so there is no
        # older release that can honestly build this module. Add the previous
        # release here the moment the floor moves below it.
        go: ["1.26.x"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # There is no go.sum: this module has no third-party dependencies, so
          # the cache is keyed on go.mod instead.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      # Guards against goroutine-scheduling flakes that a single run can hide:
      # prediction fans out across goroutines, and the row-parallel and
      # tree-parallel paths must agree with the sequential one every time.
      - name: go test -race -count=3
        run: go test -race -count=3 ./...

      - name: godoc examples
        run: go test -run Example -count=1 ./...

      # Each example program narrates its own output and exits, so running them
      # is a real end-to-end check of the three ways a model gets into a binary.
      - name: run each example program
        run: |
          for dir in classify serve batch bundle; do
            echo "===== examples/$dir ====="
            go run "./examples/$dir"
          done

      # The committed generated artifacts — Go source for examples/classify and
      # the JSON examples/serve embeds — are what the codegen test and the serve
      # example actually ship. If they drift from the generator, both are
      # validating something nobody runs. Regenerate and diff to catch it.
      # One cell of the matrix is enough: the generated bytes depend on the
      # toolchain (go/format), not on the operating system.
      - name: generated example sources are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          make gen
          git diff --exit-code -- examples/

  # The Python tooling under tools/sklexport is deliberately absent from CI. The
  # models and fixtures it produces are committed artifacts, and reproducing them
  # requires one specific scikit-learn build; a floating install would rewrite
  # them and fail for reasons that have nothing to do with the Go code. `make
  # regen` is the human-run path, and its output is reviewed in the diff.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
